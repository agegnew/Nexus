<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus Deck</title>
  <link rel="stylesheet" href="deck.css"/>
</head>
<body>
<main class="deck" id="deck">

  <header class="deck__head">
    <span class="deck__eyebrow">Nexus Deck</span>
    <strong class="deck__project" id="project-name">-</strong>
  </header>

  <!--
    Sibling of both the picker and the preview, for the same reason the reel's banner is:
    the picker is hidden the moment a deck is built, and a notice living inside it would
    disappear exactly when the reader most needs to see it.
  -->
  <aside class="notice" id="notice" hidden role="status" aria-live="polite" data-tone="warn">
    <div class="notice__text">
      <strong class="notice__head" id="notice-head"></strong>
      <span class="notice__body" id="notice-body"></span>
    </div>
    <button class="notice__close" id="notice-close" type="button">Dismiss</button>
  </aside>

  <section class="picker" id="picker" aria-label="Choose a deck">
    <p class="picker__lede">
      Turn this codebase into a presentation. One click each, and the second is fast
      because the project only has to be understood once.
    </p>

    <!--
      The same control the Reel tab carries, down to the element ids, because
      /shared/scope.js reads them. A meeting about the last three weeks needs the same
      deck the film needs, so neither tab gets to invent its own idea of a period.
    -->
    <fieldset class="scope" id="scope">
      <legend class="scope__legend">What the deck is about</legend>

      <!--
        One question, not two. The whole project is simply the widest period, so a person
        picks how far back to go once instead of first choosing a mode and then, in a
        block that appears underneath, a range.
      -->
      <div class="scope__chips" id="scope-chips" role="group" aria-label="Period">
        <button type="button" class="chipp" data-period="whole" aria-pressed="true">Whole project</button>
        <button type="button" class="chipp" data-period="this-week" aria-pressed="false">This week</button>
        <button type="button" class="chipp" data-period="last-week" aria-pressed="false">Last week</button>
        <button type="button" class="chipp" data-period="this-month" aria-pressed="false">This month</button>
        <button type="button" class="chipp" data-period="last-30" aria-pressed="false">Last 30 days</button>
        <button type="button" class="chipp" data-period="custom" aria-pressed="false">Pick dates</button>
      </div>

      <!-- The value the rest of the plugin reads. The chips above write to it. -->
      <select id="scope-period" hidden>
        <option value="whole" selected>whole</option>
        <option value="this-week">this-week</option>
        <option value="last-week">last-week</option>
        <option value="this-month">this-month</option>
        <option value="last-30">last-30</option>
        <option value="custom">custom</option>
      </select>
      <input type="hidden" id="scope-from">
      <input type="hidden" id="scope-to">

      <div class="scope__calendar" id="scope-calendar" hidden>
        <div class="cals" id="scope-cal"></div>
      </div>

      <p class="scope__dates" id="scope-dates"></p>

      <div class="scope__filters" id="scope-filters" hidden>
        <label class="scope__field">
          <span>Area</span>
          <select id="scope-area"><option value="all">All</option></select>
        </label>
        <label class="scope__toggle"><input type="checkbox" id="scope-mine" checked> Only my commits</label>
        <label class="scope__toggle"><input type="checkbox" id="scope-uncommitted" checked> Include uncommitted</label>
      </div>
    </fieldset>

    <div class="picker__cuts">
      <button class="cut" id="cut-technical" type="button" data-audience="technical">
        <span class="cut__kind">For an engineering review</span>
        <strong class="cut__name">Technical deck</strong>
        <small class="cut__blurb">Architecture, one traced path, the stack and what the analysis could not find.</small>
        <span class="cut__state" data-state="idle">Not built yet</span>
      </button>

      <button class="cut" id="cut-stakeholder" type="button" data-audience="stakeholder">
        <span class="cut__kind">For everyone else</span>
        <strong class="cut__name">Stakeholder deck</strong>
        <small class="cut__blurb">The problem, what a person can now do, and what comes next. No jargon.</small>
        <span class="cut__state" data-state="idle">Not built yet</span>
      </button>
    </div>

    <p class="picker__foot" id="status">Waiting for the IDE.</p>
  </section>

  <!--
    A presenter, not a contact sheet.

    Every slide used to be printed at once down a scrolling page, which answers "what is
    in the deck" and nothing else. A deck is read one slide at a time by somebody standing
    in front of a room, so that is what this shows: the current slide large, the rest in a
    rail beside it, and the speaker notes underneath where the presenter needs them.

    Everything here is drawn from the same positioned shapes the .pptx is written from, so
    it cannot show a slide the file does not contain.
  -->
  <section class="result" id="result" hidden aria-label="The deck">
    <div class="result__bar">
      <div class="result__meta">
        <strong class="result__title" id="result-title"></strong>
        <span class="result__sub" id="result-sub"></span>
      </div>
      <div class="result__actions">
        <button class="chip" id="notes-toggle" type="button" aria-pressed="true">Notes</button>
        <button class="chip chip--go" id="open" type="button">Open</button>
        <button class="chip" id="reveal" type="button">Show in Finder</button>
        <button class="chip" id="back" type="button">Back</button>
      </div>
    </div>

    <div class="present" id="present">
      <aside class="rail" id="rail" aria-label="Slides"></aside>

      <div class="viewer">
        <div class="viewer__stagewrap" id="stagewrap" tabindex="0" role="group"
             aria-label="Current slide. Use the arrow keys to move between slides.">
          <div class="viewer__frame" id="slide-frame">
            <div class="viewer__stage" id="slide-stage"></div>
          </div>
        </div>

        <div class="viewer__bar">
          <button class="nav" id="prev" type="button" aria-label="Previous slide">&#8249;</button>
          <span class="viewer__count"><strong id="slide-no">1</strong> / <span id="slide-total">1</span></span>
          <button class="nav" id="next" type="button" aria-label="Next slide">&#8250;</button>
          <span class="viewer__name" id="slide-name"></span>
        </div>

        <section class="notes" id="notes" aria-label="Speaker notes">
          <div class="notes__head">
            <div class="notes__tabs" role="tablist">
              <button class="notes__tab" id="tab-one" type="button" role="tab" aria-selected="true">This slide</button>
              <button class="notes__tab" id="tab-all" type="button" role="tab" aria-selected="false">All notes</button>
            </div>
            <span class="notes__hint">What you say while this slide is up</span>
          </div>
          <div class="notes__body" id="notes-one"></div>
          <div class="notes__body notes__body--list" id="notes-all" hidden></div>
        </section>
      </div>
    </div>
  </section>

</main>

<!-- Shared with the Reel tab, so "last week" means one thing in this plugin. -->
<script src="/shared/scope.js"></script>
<script src="runtime/preview.js"></script>
<script src="runtime/deck.js"></script>
</body>
</html>
