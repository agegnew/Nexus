<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus Reel</title>
  <link rel="stylesheet" href="reel.css"/>
</head>
<body>
<main class="reel" id="reel">

  <header class="reel__head">
    <span class="reel__eyebrow">Nexus Reel</span>
    <strong class="reel__project" id="project-name">-</strong>
  </header>

  <!--
    Sibling of both #picker and #stage on purpose. player.js sets picker.hidden the
    moment a reel plays, so a banner living inside it would vanish exactly when the
    viewer most needs to know that a machine did not write what they are watching.
  -->
  <aside class="notice" id="notice" hidden role="status" aria-live="polite" data-tone="warn">
    <div class="notice__text">
      <strong class="notice__head" id="notice-head"></strong>
      <span class="notice__body" id="notice-body"></span>
      <span class="notice__fix" id="notice-fix"></span>
    </div>
    <button class="notice__close" id="notice-close" type="button" aria-label="Dismiss this message">Dismiss</button>
  </aside>

  <section class="picker" id="picker" aria-label="Choose a cut">
    <p class="picker__lede">
      Turn this codebase into a short product video. One click each, and the second is
      faster because the analysis is already done.
    </p>

    <div class="picker__cuts">
      <button class="cut" id="cut-technical" type="button" data-audience="technical">
        <span class="cut__kind">For developers</span>
        <strong class="cut__name">Technical cut</strong>
        <small class="cut__blurb">How the system is put together: layers, data flow, where the complexity sits.</small>
        <span class="cut__state" data-state="idle">Not built yet</span>
      </button>

      <button class="cut" id="cut-stakeholder" type="button" data-audience="stakeholder">
        <span class="cut__kind">For everyone else</span>
        <strong class="cut__name">Stakeholder cut</strong>
        <small class="cut__blurb">What the product does for a person, in plain language. No jargon.</small>
        <span class="cut__state" data-state="idle">Not built yet</span>
      </button>
    </div>

    <p class="picker__foot" id="status">Waiting for the IDE.</p>
  </section>

  <section class="stage" id="stage" hidden aria-label="Player">
    <div class="stage__frame" id="stage-frame"></div>

    <div class="transport" id="transport" hidden>
      <div class="tp__row">
        <button class="tp__play" id="tp-play" type="button" data-mode="play" aria-label="Play">
          <span class="tp__glyph"></span>
        </button>

        <div class="tp__scrub">
          <div class="tp__track">
            <div class="tp__fill" id="tp-fill"></div>
            <div class="tp__ticks" id="tp-ticks"></div>
          </div>
          <input class="tp__range" id="tp-range" type="range"
                 min="0" max="1000" step="1" value="0" aria-label="Seek through the reel"/>
        </div>

        <span class="tp__time" id="tp-time">0:00 / 0:00</span>

        <!-- Labelled with the single word the user went looking for and did not find. -->
        <div class="tp__export">
          <button class="tp__chip" id="tp-export" type="button"
                  aria-haspopup="true" aria-expanded="false">Export</button>
          <div class="tp__menu" id="tp-export-menu" hidden role="menu">
            <button type="button" role="menuitem" data-format="html">Standalone page (.html)<small>Plays anywhere, nothing to install</small></button>
            <button type="button" role="menuitem" data-format="mp4" disabled>Video (.mp4)<small id="tp-export-mp4-why">Checking this machine...</small></button>
          </div>
        </div>

        <button class="tp__chip" id="tp-cc" type="button" aria-pressed="true"
                title="Show or hide the narration captions">CC</button>
        <button class="tp__chip" id="tp-mute" type="button" aria-pressed="false" hidden
                title="Mute or unmute the narration">Sound</button>
        <button class="tp__chip" id="tp-back" type="button">Back</button>
      </div>

      <p class="tp__now">
        <span class="tp__chapter" id="tp-chapter"></span>
        <span class="tp__note" id="tp-note"></span>
      </p>
      <p class="tp__line" id="tp-line"></p>
    </div>
  </section>

</main>

<!-- Vendored, never a CDN: a render has to produce the same frames offline in a year. -->
<script src="vendor/gsap.min.js"></script>
<script src="runtime/icons.js"></script>
<script src="runtime/scenes.js"></script>
<script src="runtime/timeline.js"></script>
<script src="runtime/audio.js"></script>
<script src="runtime/player.js"></script>
<script src="runtime/fixture.js"></script>
<!-- Last, because it may play a storyboard the IDE set before load. -->
<script src="runtime/bridge.js"></script>
</body>
</html>
